<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">

    <title>Skincare Principia</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>

    <header>
    <h1>Catálogo de Produtos Principia</h1>
    </header>
    <main class="container">

        <div class="card">
            <img src="https://m.media-amazon.com/images/I/61O43q6Iz7L._AC_SX522_.jpg" alt="Produto">
            <h2>Niacinamida 10%</h2>
            <p>Controla oleosidade e reduz manchas.</p>
            <span>R$ 49,90</span>
            <button>Comprar</button>
        </div>

        <div class="card">

            <p>Auxilia na renovação celular.</p>

            <button>Comprar</button>
        </div>

        <div class="card">
            <img src="https://i3-imagens-prd.araujo.com.br/webp/96560/0609963220359_1.webp" alt="Produto">

            <span>R$ 64,90</span>
